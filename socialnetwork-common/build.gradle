plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.3'
}

group = 'com.socialnetwork'
version = '1.0'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.1.5"
    }
}

dependencies {
    // Spring Boot (used at compile-time for annotations; consumer brings the runtime)
    api 'org.springframework.boot:spring-boot-starter-web:3.1.5'
    api 'org.springframework.boot:spring-boot-starter-security:3.1.5'
    api 'org.springframework.boot:spring-boot-starter-data-redis:3.1.5'
    api 'org.springframework.session:spring-session-data-redis:3.1.5'
    api 'org.springframework.security:spring-security-oauth2-client:6.2.0'
    api 'org.springframework.security:spring-security-oauth2-jose:6.2.0'

    // Validation
    api 'org.springframework.boot:spring-boot-starter-validation:3.1.5'

    // Lombok (explicit version)
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.1.5'
}

tasks.named('test') {
    useJUnitPlatform()
}
