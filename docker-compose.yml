version: '3.8'

services:
  mysql:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:3316:3306"

  redis:
    image: redis
    ports:
      - "6389:6379"

  rabbitmq:
    build:
      context: ./rabbitmq-with-stomp-docker
    ports:
      - "5673:5672"
      - "15673:15672"
      - "61614:61613"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  # Legacy Monolith (Acts as User/Auth Service)
  spring-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - minio
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker-compose
      - MYSQL_DATABASE=user_db

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    depends_on:
      - minio
    restart: always
    ports:
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:9091:9091"
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=spring-boot
      - GRPC_PORT=9091
      - SERVER_PORT=8083

  profile-service:
    build:
      context: ./profile-service
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
      - media-service
    restart: always
    ports:
      - "127.0.0.1:8084:8084"
      - "127.0.0.1:9092:9092"
    environment:
      - SPRING_PROFILES_ACTIVE=docker-compose
      - MEDIA_SERVICE_HOST=media-service
      - MEDIA_SERVICE_GRPC_PORT=9091
      - GRPC_PORT=9092
      - SERVER_PORT=8084
      - MYSQL_DATABASE=profile_db

  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
      - profile-service
      - media-service
      - rabbitmq
    restart: always
    ports:
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:9093:9093"
    environment:
      - SPRING_PROFILES_ACTIVE=docker-compose
      - MEDIA_SERVICE_HOST=media-service
      - MEDIA_SERVICE_GRPC_PORT=9091
      - PROFILE_SERVICE_HOST=profile-service
      - PROFILE_SERVICE_GRPC_PORT=9092
      - GRPC_PORT=9093
      - SERVER_PORT=8085
      - MYSQL_DATABASE=post_db

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
      - profile-service
      - rabbitmq
    restart: always
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker-compose
      - PROFILE_SERVICE_HOST=profile-service
      - PROFILE_SERVICE_GRPC_PORT=9092
      - SERVER_PORT=8086
      - MYSQL_DATABASE=notification_db

  feed-service:
    build:
      context: ./feed-service
      dockerfile: Dockerfile
    depends_on:
      - redis
      - profile-service
      - post-service
      - rabbitmq
    restart: always
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=docker-compose
      - PROFILE_SERVICE_HOST=profile-service
      - PROFILE_SERVICE_GRPC_PORT=9092
      - POST_SERVICE_HOST=post-service
      - POST_SERVICE_GRPC_PORT=9093
      - SERVER_PORT=8087

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    depends_on:
      - spring-app-1
      - media-service
      - profile-service
      - post-service
      - feed-service
      - notification-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker-compose
      - USER_SERVICE_HOST=spring-app-1
      - MEDIA_SERVICE_HOST=media-service
      - PROFILE_SERVICE_HOST=profile-service
      - POST_SERVICE_HOST=post-service
      - FEED_SERVICE_HOST=feed-service
      - NOTIFICATION_SERVICE_HOST=notification-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
    restart: always
    ports:
      - "3000:80"
