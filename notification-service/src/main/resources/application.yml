server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:social_network}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    stomp:
      relay:
        host: ${RABBITMQ_HOST:localhost}
        port: 61613
        login: ${RABBITMQ_USER:guest}
        passcode: ${RABBITMQ_PASSWORD:guest}

grpc:
  client:
    profile-service:
      address: static://${PROFILE_SERVICE_HOST:localhost}:${PROFILE_SERVICE_GRPC_PORT:9092}
      negotiation-type: plaintext

---
spring:
  config:
    activate:
      on-profile: docker-compose
  datasource:
    url: 'jdbc:mysql://mysql/${MYSQL_DATABASE:app}'
    username: app
    password: app
  data:
    redis:
      host: redis
      port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    stomp:
      relay:
        host: rabbitmq
        port: 61613
        login: guest
        passcode: guest
