spring:
  application:
    name: feed-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 1
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

grpc:
  client:
    profile-service:
      address: 'static://${PROFILE_SERVICE_HOST:localhost}:${PROFILE_SERVICE_GRPC_PORT:9092}'
      negotiation-type: plaintext
      default-deadline-ms: 5000
    post-service:
      address: 'static://${POST_SERVICE_HOST:localhost}:${POST_SERVICE_GRPC_PORT:9093}'
      negotiation-type: plaintext
      default-deadline-ms: 5000

server:
  port: ${SERVER_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.socialnetwork: DEBUG
    io.grpc: INFO

---
spring:
  config:
    activate:
      on-profile: docker-compose
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:devpassword}
  rabbitmq:
    host: rabbitmq
    port: 5672
grpc:
  client:
    profile-service:
      address: 'static://profile-service:9092'
      negotiation-type: plaintext
    post-service:
      address: 'static://post-service:9093'
      negotiation-type: plaintext
