spring:
  application:
    name: feed-service-test

  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379

  rabbitmq:
    listener:
      simple:
        auto-startup: false
    host: localhost
    port: 5672
    template:
      mandatory: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: test

grpc:
  client:
    profile-service:
      address: 'static://localhost:9092'
      negotiation-type: plaintext
    post-service:
      address: 'static://localhost:9093'
      negotiation-type: plaintext

server:
  port: 0

logging:
  level:
    com.socialnetwork: WARN
    io.grpc: WARN
