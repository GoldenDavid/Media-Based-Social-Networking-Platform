spring:
  application:
    name: profile-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost/profile_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root@123}
    tomcat:
      max-active: 50
      max-wait: 10000
      test-on-borrow: true

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 1
      password: ${REDIS_PASSWORD:}

grpc:
  server:
    port: ${GRPC_PORT:9092}
  client:
    media-service:
      address: 'static://${MEDIA_SERVICE_HOST:localhost}:${MEDIA_SERVICE_GRPC_PORT:9091}'
      negotiation-type: plaintext
      default-deadline-ms: 5000

server:
  port: ${SERVER_PORT:8084}

springdoc:
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.socialnetwork: DEBUG
    io.grpc: INFO

---
spring:
  config:
    activate:
      on-profile: docker-compose
  datasource:
    url: 'jdbc:mysql://mysql/${MYSQL_DATABASE:profile_db}'
    username: app
    password: app
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:devpassword}
grpc:
  client:
    media-service:
      address: 'static://media-service:9091'
      negotiation-type: plaintext
