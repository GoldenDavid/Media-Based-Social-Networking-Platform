spring:
  application:
    name: profile-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost/spring_session}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root@123}
    tomcat:
      max-active: 50
      max-wait: 10000
      test-on-borrow: true

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 1

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:CHANGE_YOUR_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:CHANGE_YOUR_GOOGLE_SECRET_CLIENT_ID}
            scope:
              - email
              - profile

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}

# gRPC server — serves profile queries to Post Service, Feed Service, etc.
grpc:
  server:
    port: ${GRPC_PORT:9092}
  # gRPC client — calls Media Service for profile image uploads
  client:
    media-service:
      address: 'static://${MEDIA_SERVICE_HOST:localhost}:${MEDIA_SERVICE_GRPC_PORT:9091}'
      negotiation-type: plaintext

server:
  port: ${SERVER_PORT:8092}

springdoc:
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.socialnetwork: DEBUG
    io.grpc: INFO

---
spring:
  config:
    activate:
      on-profile: docker-compose
  datasource:
    url: 'jdbc:mysql://mysql/app'
    username: app
    password: app
  data:
    redis:
      host: redis
      port: 6379
grpc:
  client:
    media-service:
      address: 'static://media-service:9091'
      negotiation-type: plaintext
