spring:
  application:
    name: post-service

  # ── Persistence ──────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost/post_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root@123}
    tomcat:
      max-active: 50
      max-wait: 10000
      test-on-borrow: true

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: false

  # ── Redis (used for Spring Session, shares the monolith's namespace) ─────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}

  session:
    store-type: redis
    redis:
      namespace: engineerpro:app

  # ── RabbitMQ (publishes postId to after-create-post-queue via the
  #    DEFAULT exchange — routing key = queue name. See
  #    com.socialnetwork.post.config.MessageQueueConfig#afterCreatePostQueue)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# ── gRPC ──────────────────────────────────────────────────────────────────
grpc:
  server:
    port: ${GRPC_PORT:9093}
  client:
    media-service:
      address: 'static://${MEDIA_SERVICE_HOST:localhost}:${MEDIA_SERVICE_GRPC_PORT:9091}'
      negotiation-type: plaintext
      default-deadline-ms: 5000
    profile-service:
      address: 'static://${PROFILE_SERVICE_HOST:localhost}:${PROFILE_SERVICE_GRPC_PORT:9092}'
      negotiation-type: plaintext
      default-deadline-ms: 5000

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.socialnetwork: DEBUG
    io.grpc: INFO

---
spring:
  config:
    activate:
      on-profile: docker-compose
  datasource:
    url: 'jdbc:mysql://mysql/${MYSQL_DATABASE:post_db}'
    username: app
    password: app
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:devpassword}
  rabbitmq:
    host: rabbitmq
    port: 5672
grpc:
  client:
    media-service:
      address: 'static://media-service:9091'
      negotiation-type: plaintext
    profile-service:
      address: 'static://profile-service:9092'
      negotiation-type: plaintext
