server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            # Explicit origin list — NEVER use "*" together with allowCredentials: true.
            # Spring rejects that combination at startup.
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Media Service
        - id: media-service
          uri: http://${MEDIA_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/media/**

        # Profile Service
        - id: profile-service
          uri: http://${PROFILE_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/profiles/**, /followers/**, /follow/**

        # Post Service
        - id: post-service
          uri: http://${POST_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/posts/**, /comments/**

        # Feed Service
        - id: feed-service
          uri: http://${FEED_SERVICE_HOST:localhost}:8087
          predicates:
            - Path=/dynamic-feeds/**, /precomputed-feeds/**

        # Notification Service (REST + STOMP WebSocket handshake)
        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:8086
          predicates:
            - Path=/gs-guide-websocket/**, /notifications/**

        # Auth (explicit route for /auth/** — covers /auth/inspect etc.)
        # user-service is a dedicated microservice running on port 8081.
        - id: user-service-auth
          uri: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

        # OAuth2 / user endpoints
        - id: user-service-oauth
          uri: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}
          predicates:
            - Path=/oauth2/**, /login/**, /logout/**, /users/**

        # NOTE: Swagger / OpenAPI docs are intentionally NOT routed through the gateway.
        # Reason: dev-only surface, different per service, would add 5+ open routes and
        # make CORS/cookie config messier. In dev, hit each service directly:
        #   http://localhost:8083/v3/api-docs  (media)
        #   http://localhost:8084/v3/api-docs  (profile)
        #   http://localhost:8085/v3/api-docs  (post)
        #   http://localhost:8086/v3/api-docs  (notification)
        #   http://localhost:8087/v3/api-docs  (feed)
        #   http://localhost:8081/v3/api-docs  (monolith)
        # If we add per-service routes later, wrap them in a "dev" profile block.

management:
  endpoints:
    web:
      exposure:
        include: gateway,health
