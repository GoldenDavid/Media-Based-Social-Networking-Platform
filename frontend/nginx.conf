server {
    listen 80;
    server_name localhost;

    # ── Security headers (applied to all responses from this server block) ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self' ws: wss: http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS is only useful over HTTPS — keep it commented in dev.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # ── Static SPA shell ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # Never let the browser cache index.html / SPA shell.
        add_header Cache-Control "no-store" always;
    }

    # ── Media (long-lived, immutable) ───────────────────────────────────────
    # /api/media/* is proxied to the gateway then to media-service, which
    # ultimately serves from MinIO. Cache aggressively so avatars and
    # uploaded images don't re-fetch on every navigation.
    location /api/media/ {
        proxy_pass http://api-gateway:8080/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── WebSocket (STOMP) — proxied to notification-service via the gateway ──
    location /api/gs-guide-websocket/ {
        proxy_pass http://api-gateway:8080/gs-guide-websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        add_header Cache-Control "no-store" always;
    }

    # ── Plain /ws/ alias (kept for future WebSocket routes) ────────────────
    location /ws/ {
        proxy_pass http://api-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        add_header Cache-Control "no-store" always;
    }

    # ── All other API traffic — never cache (user-specific, session-bearing)
    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Cookie $http_cookie;

        add_header Cache-Control "no-store" always;
    }

    # ── Health endpoint (used by docker HEALTHCHECK) ───────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
