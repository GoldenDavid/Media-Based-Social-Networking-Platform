<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SockJS-client (transitive dep of @stomp/stompjs) probes for a Node-style
      // `global` identifier in some bundling scenarios. Modern browsers do not
      // expose it, so we alias it to `window` before any module evaluates.
      // Safe to keep — runs once at document start and is idempotent.
      window.global = window;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
