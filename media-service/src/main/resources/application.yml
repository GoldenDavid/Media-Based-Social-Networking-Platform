spring:
  application:
    name: media-service

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:spring-boot}

# gRPC server listens on a dedicated port (separate from the HTTP port)
grpc:
  server:
    port: ${GRPC_PORT:9091}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.socialnetwork: DEBUG
    io.grpc: INFO
