logging:
    file:
        name: ./log/application.log
    level:
        org:
            springframework:
                jdbc:
                    core: TRACE
                web:
                    filter:
                        CommonsRequestLoggingFilter: DEBUG
spring:
    data:
        redis:
            database: 1
            host: localhost
            port: 6379
    datasource:
        password: root@123
        tomcat:
            max-active: 50
            max-wait: 10000
            test-on-borrow: true
        url: jdbc:mysql://localhost/spring_session
        username: root
    jpa:
        generate-ddl: true
        hibernate:
            ddl-auto: update
        show-sql: true
    rabbitmq:
        host: localhost
        port: 5672
        stomp:
            relay:
                host: localhost
                port: 61613
                login: guest
                passcode: guest
    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: CHANGE_YOUR_GOOGLE_CLIENT_ID
                        client-secret: CHANGE_YOUR_GOOGLE_SECRET_CLIENT_ID
                        scope:
                            - email
                            - profile
    minio:
        endpoint: http://localhost:9000
        access-key: minioadmin
        secret-key: minioadmin
        bucket: spring-boot
springdoc:
    api-docs:
        path: /api-docs

# ── gRPC clients ──────────────────────────────────────────────────────────────
# media-service: handles image uploads (base64 → MinIO)
# profile-service: resolves profiles and follower/following graph
grpc:
    client:
        media-service:
            address: 'static://localhost:9091'
            negotiation-type: plaintext
        profile-service:
            address: 'static://localhost:9092'
            negotiation-type: plaintext

---
spring.config.activate.on-profile: local
---
spring.config.activate.on-profile: docker-compose
spring:
    datasource:
        url: 'jdbc:mysql://mysql/app'
        username: app
        password: app
    data:
        redis:
            host: redis
            port: 6379
    rabbitmq:
        host: rabbitmq
        port: 5672
        stomp:
            relay:
                host: rabbitmq
                port: 61613
                login: guest
                passcode: guest
    minio:
        endpoint: http://minio:9000
grpc:
    client:
        media-service:
            address: 'static://media-service:9091'
            negotiation-type: plaintext
        profile-service:
            address: 'static://profile-service:9092'
            negotiation-type: plaintext

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
  session:
    store-type: none
  data:
    redis:
      repositories:
        enabled: false
  rabbitmq:
    listener:
      type: simple
      simple:
        auto-startup: false