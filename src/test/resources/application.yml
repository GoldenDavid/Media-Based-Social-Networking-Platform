spring:
  application:
    name: monolith-test

  datasource:
    url: jdbc:h2:mem:monolithdb_test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: true

  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: test

grpc:
  client:
    media-service:
      address: 'static://localhost:9091'
      negotiation-type: plaintext
    profile-service:
      address: 'static://localhost:9092'
      negotiation-type: plaintext

server:
  port: 0

logging:
  level:
    com.socialnetwork: WARN
    io.grpc: WARN
